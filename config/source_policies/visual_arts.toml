# Versioned source policy for English-language visual arts coverage research.
# Manually reviewed; never auto-synced from Wikipedia Perennial Sources at runtime.
# First matching rule in file order wins. No match ⇒ unclassified (default.unclassified).

schema_version = 1
key = "visual-arts-en-sources"
label = "English visual arts publisher policy"

