schema_version = 1
timezone = "Europe/Paris"
feeds_file = "discovery-feeds.toml"
domain_profile_file = "discovery_profiles/art.toml"
# Required: versioned publisher screening policy (relative to this config file).
source_policy_file = "source_policies/visual_arts.toml"

[secrets]
openrouter_api_key = "OPENROUTER_API_KEY"
brave_api_key = "BRAVE_API_KEY"

[transport]
# Appended to the default user agent so operators can be contacted.
contact_url = "https://example.com/contact"
connect_timeout_seconds = 10.0
read_timeout_seconds = 30.0
llm_read_timeout_seconds = 300.0
max_redirects = 5
max_api_response_bytes = 5242880
max_article_response_bytes = 10485760

[retry]
max_attempts = 3
initial_backoff_seconds = 1.0
max_backoff_seconds = 30.0
backoff_multiplier = 2.0
jitter_ratio = 0.25
provider_pause_after_consecutive_exhaustions = 3

[concurrency]
http_workers = 4
llm_workers = 2
per_origin = 2

[pacing]
mediawiki_min_interval_ms = 900
brave_min_interval_ms = 1100

[budget]
# Optional hard per-run OpenRouter cap as a decimal USD string. Omit for no cap.
# openrouter_usd_per_run = "2.50"

[openrouter]
endpoint = "https://openrouter.ai/api/v1"

[openrouter.routing]
# Provider fallback may change the serving provider, never the configured model.
allow_fallbacks = true
data_collection = "deny"
zdr = true

[mediawiki]
# Public Action API only — no authentication secret.
endpoint = "https://en.wikipedia.org/w/api.php"
maxlag_seconds = 5

[brave]
# BraveConfig: endpoint and one plan flag. Auth is env BRAVE_API_KEY.
endpoint = "https://api.search.brave.com/res/v1/web/search"
# `extra_snippets` is a paid-plan parameter: Brave rejects it on the free and
# base tiers, and that rejection is permanent, so leave it false unless your
# subscription includes it.
extra_snippets = false

[tasks.detect_people]
model = "openai/gpt-5.4-mini"
# Measured in worst-case UTF-8 bytes, not model tokens. It must exceed this
# task's fixed prompt+schema+framing floor PLUS its own content caps, or the
# request is silently truncated (detect) or rejected (resolve/match). At 4096
# a saturated detect_people request truncated the title to ~13 characters and
# the model correctly reported it could identify nobody. 65536 leaves roughly
# 5x headroom over the measured requirement; the real spend guard is
# [budget] openrouter_usd_per_run, not this ceiling.
max_input_tokens = 65536
max_completion_tokens = 1024
max_people = 8
max_title_characters = 500
max_summary_characters = 4000

[tasks.detect_people.parameters]
# temperature and top_p are deliberately unset. The default models are
# reasoning models whose OpenRouter endpoints declare support for neither,
# and [openrouter.routing] requires an endpoint to support every supplied
# parameter, so sending either one leaves no eligible endpoint (HTTP 404).
# Set them only for a model whose endpoints advertise them.
# temperature = 0.0
# top_p = 1.0
reasoning_effort = "low"

[tasks.resolve_person_entity]
model = "openai/gpt-5.4-mini"
max_input_tokens = 65536
max_completion_tokens = 1024
max_candidates = 8
max_facts_per_candidate = 12
max_names_per_candidate = 8
max_title_characters = 500
max_summary_characters = 4000

[tasks.resolve_person_entity.parameters]
# temperature and top_p are deliberately unset. The default models are
# reasoning models whose OpenRouter endpoints declare support for neither,
# and [openrouter.routing] requires an endpoint to support every supplied
# parameter, so sending either one leaves no eligible endpoint (HTTP 404).
# Set them only for a model whose endpoints advertise them.
# temperature = 0.0
# top_p = 1.0
reasoning_effort = "low"

[tasks.match_wikipedia_identity]
model = "openai/gpt-5.4-mini"
max_input_tokens = 65536
max_completion_tokens = 1024
max_candidates = 8
max_query_forms = 6
search_srlimit = 10
max_continuations_per_form = 1
max_search_hits_per_form = 20
max_page_ids_per_facts_request = 20
max_redirect_hops = 3
max_fact_pages_per_plan = 40
max_extract_characters = 1200
max_categories_per_page = 20
max_names_in_prompt = 8
max_facts_in_prompt = 16
refresh_interval_hours = 720
max_title_characters = 500
max_summary_characters = 4000

[tasks.match_wikipedia_identity.parameters]
# temperature and top_p are deliberately unset. The default models are
# reasoning models whose OpenRouter endpoints declare support for neither,
# and [openrouter.routing] requires an endpoint to support every supplied
# parameter, so sending either one leaves no eligible endpoint (HTTP 404).
# Set them only for a model whose endpoints advertise them.
# temperature = 0.0
# top_p = 1.0
reasoning_effort = "low"

# Plan-level bounds (including coverage_refresh_interval_hours) live under
# [tasks.assess_article] co-located with every field that enters
# coverage_material_fingerprint (model, passage/retrieval caps, etc.). The
# refresh *interval* is a scheduling knob on this object; the fingerprint
# hashes refresh_of_plan_id, not the interval hours. Co-location is intentional,
# not that refresh is assessment-specific (K33).
[tasks.assess_article]
model = "openai/gpt-5.4-mini"
# Worst-case assess input is measured in UTF-8 bytes, not model tokens, so this
# is roughly 16k real tokens. It must stay at or above the fixed prompt/schema
# floor plus max_passage_characters, max_title_characters, and
# max_summary_characters, or configuration validation rejects it. Unlike the
# three text tasks, this one has a real floor validator.
max_input_tokens = 65536
max_completion_tokens = 1024
max_title_characters = 500
max_summary_characters = 4000
retrieval_target = 5
max_exact_forms = 4
max_alias_forms = 4
max_context_forms = 1
search_count = 10
max_offsets_per_form = 0
max_results_per_form = 20
max_eligible_fetches = 8
max_unclassified_fetches = 2
max_passage_characters = 6000
max_passage_blocks = 24
opening_block_count = 2
coverage_refresh_interval_hours = 720
reject_altered_query = false
assess_ineligible = false

[tasks.assess_article.parameters]
# temperature and top_p are deliberately unset. The default models are
# reasoning models whose OpenRouter endpoints declare support for neither,
# and [openrouter.routing] requires an endpoint to support every supplied
# parameter, so sending either one leaves no eligible endpoint (HTTP 404).
# Set them only for a model whose endpoints advertise them.
# temperature = 0.0
# top_p = 1.0
reasoning_effort = "low"

[tasks.aggregate_lead]
promising_domain_threshold = 2
digest_limit = 10
starvation_days = 14
reminder_interval_days = 0

[digest]
write_latest_copy = true

[logging]
max_bytes = 5242880
backup_count = 5
