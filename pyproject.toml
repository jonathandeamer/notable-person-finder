[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "notable-person-finder"
version = "0.1.0"
description = "A personal batch tool for finding inspectable Wikipedia biography leads"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
  "feedparser>=6.0,<7",
  "httpx>=0.28,<0.29",
  "openrouter>=1.0,<2",
  "platformdirs>=4.3,<5",
  "portalocker>=3.1,<4",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "trafilatura>=2.0,<3",
  "tzdata>=2025.2",
]

[project.scripts]
notable = "notable_person_finder.cli.main:entrypoint"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.4,<9",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/notable_person_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = ["live: explicitly invoked tests that contact external providers"]

[tool.ruff]
line-length = 88
target-version = "py313"
# The legacy prototype is historical evidence and the operational fallback
# until product cutover; it is never linted or formatted. These patterns match
# by path segment at any depth, so a future rewrite package must not reuse one
# of these bare names -- `src/notable_person_finder/ingestion/` is safe, a
# package literally named `ingest` or `state` would not be. Verify with
# `uv run ruff check . --show-files` after adding a package.
extend-exclude = [
    "run_pipeline.py",
    "name_utils.py",
    "scripts",
    "ingest",
    "prompts",
    "output",
    "state",
    "tests/test_*",
    "tests/conftest.py",
    # `ruff format` rewrites Python code blocks inside Markdown. Specs and plans
    # are authorities, not source: their code blocks are illustrative by policy
    # and must not be silently reformatted into looking canonical.
    "docs",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["notable_person_finder"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = [
    "src",
    "tests/foundation",
    "tests/run_engine",
    "tests/ingestion",
    "tests/people",
]
exclude = ["**/__pycache__", ".venv", ".worktrees"]
