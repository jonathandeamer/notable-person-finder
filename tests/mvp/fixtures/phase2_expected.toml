# Phase 2 corpus gate. Wikipedia match applied: entries below are the
# research-worthy mentions that do NOT already have a matching Wikipedia
# page. must_detect is an exact multiset against digest headings (sorted).
#
# This fixture is trimmed from the live 246-item run to the 226 items that
# settled cleanly. The 20 that remained genuinely incomplete after two
# attempts (a real MediaWiki/model failure that was never cached, since only
# validated successes are cached) are excluded from the replay corpus via
# excluded_urls -- pre-seeding them as abandoned so a fresh replay never
# attempts them, rather than let a replay hit an uncached call and crash.
#
# Known weak extraction kept for regression lock until detection improves:
#   the bare 'Obama'/'Trump'/'Kate'/'Leonardo' names, and one role reference
#   ('the director of the Smithsonian's National Museum of American History')
#   that should have been marked not research-worthy.
